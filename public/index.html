<h1>negative-keywords-bot</h1>
<p>Telegram-бот, который разбирает отчёт «Поисковые запросы» Google Ads и готовит минус-слова.</p>
<p>Здесь нет интерфейса: единственная точка входа — вебхук <code>POST /api/telegram</code>,
и он отвечает только на запросы Telegram с верным секретным заголовком.</p>
